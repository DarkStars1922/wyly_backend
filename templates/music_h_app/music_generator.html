<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五音疗愈音乐生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header {
            background: rgba(0, 10, 30, 0.9);
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(100, 149, 237, 0.3);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #3498db, #8e44ad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        header p {
            color: #aab2c8;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-section {
            background: rgba(20, 30, 60, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #6495ed;
            font-size: 1.1rem;
        }
        
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(100, 149, 237, 0.3);
            background: rgba(10, 20, 40, 0.7);
            color: #f0f8ff;
            font-size: 1.1rem;
            resize: vertical;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
        }
        
        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .option {
            flex: 1;
            min-width: 200px;
        }
        
        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(100, 149, 237, 0.3);
            background: rgba(10, 20, 40, 0.7);
            color: #f0f8ff;
            font-size: 1.1rem;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
        }
        
        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        
        button {
            background: linear-gradient(90deg, #3498db, #8e44ad);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-section {
            background: rgba(20, 30, 60, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .progress-container {
            background: rgba(10, 20, 40, 0.7);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #8e44ad);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
            position: relative;
        }
        
        .progress-text {
            text-align: center;
            font-size: 1.1rem;
            color: #aab2c8;
        }
        
        .audio-section {
            background: rgba(20, 30, 60, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .audio-container {
            background: rgba(10, 20, 40, 0.7);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .audio-title {
            text-align: center;
            margin-bottom: 20px;
            color: #6495ed;
            font-size: 1.4rem;
        }
        
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        audio::-webkit-media-controls-panel {
            background: rgba(20, 30, 60, 0.8);
            border-radius: 10px;
        }
        
        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .examples {
            margin-top: 30px;
            background: rgba(20, 30, 60, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .examples h3 {
            color: #6495ed;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .examples ul {
            list-style: none;
            padding-left: 20px;
        }
        
        .examples li {
            margin-bottom: 12px;
            padding-left: 30px;
            position: relative;
            line-height: 1.6;
        }
        
        .examples li:before {
            content: "\f001";
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            left: 0;
            top: 5px;
            color: #8e44ad;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #aab2c8;
            border-top: 1px solid rgba(100, 149, 237, 0.3);
            font-size: 0.9rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            background: #e74c3c;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(150%);
            transition: transform 0.4s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: #2ecc71;
        }
        
        @media (max-width: 600px) {
            .options {
                flex-direction: column;
                gap: 15px;
            }
            
            .option {
                min-width: 100%;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }
        
        .visualizer {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            margin-top: 20px;
        }
        
        .bar {
            width: 6px;
            background: linear-gradient(to top, #3498db, #8e44ad);
            border-radius: 3px 3px 0 0;
            height: 20%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-music"></i> 五音疗愈音乐生成器</h1>
            <p>使用人工智能技术，根据您的描述生成独特的音乐作品，治愈心灵</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label for="description"><i class="fas fa-comment-dots"></i> 描述您想要的音乐</label>
                    <textarea id="description" placeholder="例如：欢快的电子舞曲，带有强烈的贝斯线和清脆的鼓点...">浪漫的钢琴旋律，轻柔的弦乐背景</textarea>
                </div>
                
                <div class="options">
                    <div class="option">
                        <label for="duration"><i class="fas fa-clock"></i> 时长（秒）</label>
                        <select id="duration">
                            <option value="5">5秒</option>
                            <option value="10">10秒</option>
                            <option value="15" selected>15秒</option>
                            <option value="20">20秒</option>
                            <option value="30">30秒</option>
                        </select>
                    </div>
                    
                    <div class="option">
                        <label for="format"><i class="fas fa-file-audio"></i> 音频格式</label>
                        <select id="format">
                            <option value="wav">WAV（高质量）</option>
                            <option value="mp3">MP3（较小文件）</option>
                        </select>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button id="generate-btn">
                        <i class="fas fa-bolt"></i> 生成音乐
                    </button>
                </div>
            </div>
            
            <div class="progress-section" id="progress-section">
                <h3>正在创作您的音乐...</h3>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="progress-text" id="progress-text">初始化模型...</div>
                <div class="visualizer" id="visualizer"></div>
            </div>
            
            <div class="audio-section" id="audio-section">
                <div class="audio-container">
                    <div class="audio-title"><i class="fas fa-headphones"></i> 您的音乐作品</div>
                    <audio id="audio-player" controls></audio>
                    <div class="visualizer" id="audio-visualizer"></div>
                    <a href="#" id="download-btn" class="download-btn">
                        <i class="fas fa-download"></i> 下载音频
                    </a>
                </div>
            </div>
            
            <div class="examples">
                <h3><i class="fas fa-lightbulb"></i> 创作灵感示例</h3>
                <ul>
                    <li>轻松的爵士钢琴三重奏，中等节奏，带有温暖的贝斯线</li>
                    <li>史诗电影配乐，宏大的管弦乐团，震撼的打击乐</li>
                    <li>80年代复古合成波，强烈的电子鼓和闪亮的琶音</li>
                    <li>热带浩室音乐，轻快的钢鼓旋律和海滩氛围</li>
                    <li>忧郁的蓝调吉他独奏，慢节奏，带有口琴伴奏</li>
                </ul>
            </div>
        </div>
        
        <footer>
            <p>© 2025 五音疗愈音乐生成器 | 使用先进的MusicGen技术</p>
        </footer>
    </div>
    
    <div class="notification" id="notification">错误消息示例</div>
    
    <script>
        // DOM元素
        const descriptionEl = document.getElementById('description');
        const durationEl = document.getElementById('duration');
        const formatEl = document.getElementById('format');
        const generateBtn = document.getElementById('generate-btn');
        const progressSection = document.getElementById('progress-section');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const audioSection = document.getElementById('audio-section');
        const audioPlayer = document.getElementById('audio-player');
        const downloadBtn = document.getElementById('download-btn');
        const notificationEl = document.getElementById('notification');
        const visualizer = document.getElementById('visualizer');
        const audioVisualizer = document.getElementById('audio-visualizer');
        
        // 创建音频可视化器
        function createVisualizer(container, count = 50) {
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                container.appendChild(bar);
            }
        }
        
        // 初始化可视化器
        createVisualizer(visualizer, 40);
        createVisualizer(audioVisualizer, 50);
        
        // 更新可视化器
        function updateVisualizer(container, intensity = 0.5) {
            const bars = container.querySelectorAll('.bar');
            bars.forEach(bar => {
                // 随机高度，但受整体强度影响
                const height = Math.random() * 80 + 20;
                const newHeight = Math.max(10, height * (0.5 + Math.random() * intensity));
                bar.style.height = `${newHeight}%`;
                
                // 随机颜色变化
                const hue = 240 + Math.random() * 60;
                bar.style.background = `linear-gradient(to top, hsl(${hue}, 70%, 60%), hsl(${hue + 30}, 80%, 50%)`;
            });
        }
        
        // 显示通知
        function showNotification(message, isError = true) {
            notificationEl.textContent = message;
            notificationEl.className = isError ? 'notification' : 'notification success';
            notificationEl.classList.add('show');
            
            setTimeout(() => {
                notificationEl.classList.remove('show');
            }, 5000);
        }
        
        // 更新进度
        function updateProgress(percent, message) {
            progressBar.style.width = `${percent}%`;
            progressText.textContent = message;
        }
        
        // 处理后端返回的音频文件
        function handleAudioResponse(blob, format) {
            // 创建对象URL
            const audioUrl = URL.createObjectURL(blob);
            
            // 设置音频播放器
            audioPlayer.src = audioUrl;
            
            // 设置下载链接
            downloadBtn.href = audioUrl;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            downloadBtn.download = `musicgen_${timestamp}.${format}`;
            
            // 显示音频部分
            progressSection.style.display = 'none';
            audioSection.style.display = 'block';
            
            // 显示成功通知
            showNotification("音乐生成成功！", false);
            
            // 启用按钮
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<i class="fas fa-bolt"></i> 生成音乐';
            
            // 为音频可视化器设置动画
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaElementSource(audioPlayer);
            
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function visualize() {
                requestAnimationFrame(visualize);
                
                analyser.getByteFrequencyData(dataArray);
                
                const bars = audioVisualizer.querySelectorAll('.bar');
                for (let i = 0; i < bars.length; i++) {
                    const value = dataArray[i % bufferLength] / 255;
                    const height = Math.max(10, value * 100);
                    bars[i].style.height = `${height}%`;
                    
                    // 颜色变化
                    const hue = 240 + value * 60;
                    bars[i].style.background = `linear-gradient(to top, hsl(${hue}, 70%, 60%), hsl(${hue + 30}, 80%, 50%)`;
                }
            }
            
            audioPlayer.addEventListener('play', () => {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                visualize();
            });
        }
        
        // 生成音乐
        async function generateMusic() {
            const description = descriptionEl.value.trim();
            const duration = durationEl.value;
            const format = formatEl.value;
            
            if (!description) {
                showNotification("请输入音乐描述");
                return;
            }
            
            // 禁用按钮
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
            
            // 显示进度部分
            progressSection.style.display = 'block';
            audioSection.style.display = 'none';
            updateProgress(10, "准备生成请求...");
            
            try {
                // 模拟进度（实际项目中应替换为真实的API调用）
                simulateProgress();
                
                // 实际API调用代码
                // 注意：这里的URL需要替换为实际后端API地址
                const response = await fetch('/api/generate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: description,
                        duration: duration,
                        format: format
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`请求失败: ${response.status} ${response.statusText}`);
                }
                
                // 获取音频Blob
                const blob = await response.blob();
                
                // 处理音频
                handleAudioResponse(blob, format);
                
            } catch (error) {
                console.error("生成音乐失败:", error);
                showNotification(`生成失败: ${error.message}`);
                
                // 启用按钮
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-bolt"></i> 生成音乐';
                
                // 隐藏进度部分
                progressSection.style.display = 'none';
            }
        }
        
        // 模拟进度（仅用于演示）
        function simulateProgress() {
            let progress = 10;
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress >= 90) {
                    clearInterval(interval);
                    updateProgress(90, "正在完成处理...");
                } else {
                    const messages = [
                        "正在分析描述...",
                        "生成音乐结构...",
                        "创作旋律...",
                        "添加节奏和声...",
                        "混音处理中...",
                        "最终优化..."
                    ];
                    const messageIndex = Math.floor(progress / 20);
                    updateProgress(progress, messages[messageIndex] || "正在生成...");
                }
            }, 500);
            
            // 更新可视化器
            const vizInterval = setInterval(() => {
                updateVisualizer(visualizer, progress/100);
                if (progress >= 90) {
                    clearInterval(vizInterval);
                }
            }, 100);
        }
        
        // 事件监听器
        generateBtn.addEventListener('click', generateMusic);
        
        // 初始化音频可视化器动画
        setInterval(() => {
            if (progressSection.style.display === 'block') {
                updateVisualizer(visualizer, Math.random() * 0.3 + 0.2);
            }
        }, 200);
    </script>
</body>
</html>
