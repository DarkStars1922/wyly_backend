{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧疗愈-正念模式</title>
  <!-- face-api.js -->
  <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #a8edea;
      --secondary: #fed6e3;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-color: #ffffff;
      --accent-color: #00d2ff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* 主容器 */
    .main-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      z-index: 10;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 5px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    
    .subtitle {
      font-size: 1rem;
      opacity: 0.7;
      font-weight: 300;
    }

    /* 摄像头区域 */
    .camera-wrapper {
      position: relative;
      width: 640px;
      height: 480px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      transition: all 0.5s ease;
    }

    /* 移动端适配 */
    @media (max-width: 700px) {
      .camera-wrapper {
        width: 100%;
        height: 350px;
      }
      h1 { font-size: 1.8rem; }
    }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 扫描线动画 */
    .scan-line {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 5px;
      background: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-color);
      opacity: 0;
      z-index: 5;
    }

    .scanning .scan-line {
      opacity: 1;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    /* 控制按钮区域 */
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      z-index: 10;
    }

    .btn {
      padding: 15px 40px;
      border-radius: 50px;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border: none;
    }

    /* 结果弹窗 */
    .result-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease; 
    }

    .result-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }

    .emotion-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: pulseIcon 2s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.5));
    }

    @keyframes pulseIcon {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .result-title {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .result-desc {
      font-size: 1.2rem;
      color: #eee;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    /* 跳转加载圈 */
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid #FFF;
      border-radius: 50%;
      display: inline-block;
      position: relative;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-top: 20px;
    }
    .loader::after {
      content: '';  
      box-sizing: border-box;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom-color: var(--accent-color);
    }
    
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }

  </style>
</head>
<body>

  <header>
    <h1>智慧疗愈-正念模式</h1>
    <div class="subtitle">进入您的专属疗愈空间</div>
  </header>
  
  <div class="main-container">
    <!-- 摄像头容器 -->
    <div class="camera-wrapper" id="cameraWrapper">
      <video id="video" autoplay muted playsinline></video>
      <!-- 扫描线 -->
      <div class="scan-line"></div>
      
      <!-- 状态提示 -->
      <div class="loading-text" id="statusText">正在初始化 AI 模型...</div>

      <!-- 结果覆盖层 -->
      <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
          <div class="emotion-icon" id="resultIcon">✨</div>
          <h2 class="result-title" id="resultTitle">识别完成</h2>
          <p class="result-desc" id="resultDesc"></p>
          
          <!-- 加载动画 -->
          <span class="loader"></span>
        </div>
      </div>
    </div>
    
    <!-- 控制按钮 -->
    <div class="controls">
      <button id="startScanBtn" class="btn btn-primary" disabled>
        <i class="fas fa-play"></i> 开启我的专属疗愈
      </button>
    </div>
  </div>

  <script>
    // 定义五行对应的跳转链接
    const SPACE_URLS = {
      'wood': "{% url 'wood_xiao' %}",     // 木 - 怒
      'fire': "{% url 'fire_erhu' %}",      // 火 - 喜
      'earth': "{% url 'earth_pipa' %}",    // 土 - 思
      'metal': "{% url 'metal_zhudi' %}",    // 金 - 悲
      'water': "{% url 'water_guqin' %}"    // 水 - 恐
    };

    // 逻辑代码

    const video = document.getElementById('video');
    const cameraWrapper = document.getElementById('cameraWrapper');
    const startScanBtn = document.getElementById('startScanBtn');
    const statusText = document.getElementById('statusText');
    
    const resultOverlay = document.getElementById('resultOverlay');
    const resultTitle = document.getElementById('resultTitle');
    const resultDesc = document.getElementById('resultDesc');
    const resultIcon = document.getElementById('resultIcon');

    let modelsLoaded = false;
    let detectionInterval;
    let emotionSamples = [];
    let canvas; // 仅用于后台计算

    // 映射关系
    const emotionMap = {
      'angry':     { element: 'wood',  zh: '怒', icon: '😠' },
      'disgusted': { element: 'wood',  zh: '厌', icon: '😣' },
      'happy':     { element: 'fire',  zh: '喜', icon: '😊' },
      'surprised': { element: 'fire',  zh: '惊', icon: '😲' },
      'sad':       { element: 'metal', zh: '悲', icon: '😢' },
      'fearful':   { element: 'water', zh: '恐', icon: '😨' },
      'neutral':   { element: 'earth', zh: '平稳', icon: '😐' } 
    };

    // 1. 初始化
    async function init() {
      try {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
        
        modelsLoaded = true;
        statusText.textContent = "AI 模型加载完毕，请允许摄像头权限";
        startCamera();
      } catch (err) {
        console.error(err);
        statusText.textContent = "模型加载失败，请检查网络";
      }
    }

    // 2. 开启摄像头
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          statusText.textContent = "准备就绪";
          startScanBtn.disabled = false;
        };
      } catch (err) {
        statusText.textContent = "无法访问摄像头";
      }
    }

    // 3. 开始扫描
    startScanBtn.addEventListener('click', () => {
      if (!modelsLoaded) return;

      startScanBtn.style.display = 'none'; 
      cameraWrapper.classList.add('scanning'); 
      statusText.textContent = "正在分析您的情绪特征...";
      
      emotionSamples = [];

      if (!canvas) canvas = faceapi.createCanvasFromMedia(video);

      let scanTime = 0;
      const maxScanTime = 3000;
      const intervalTime = 200;

      detectionInterval = setInterval(async () => {
        // 后台检测
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
        
        if (detections.length > 0) {
          const expressions = detections[0].expressions;
          const maxExp = Object.entries(expressions).reduce((a, b) => a[1] > b[1] ? a : b);
          emotionSamples.push(maxExp[0]);
        }

        scanTime += intervalTime;
        if (scanTime >= maxScanTime) {
          finishScanning();
        }
      }, intervalTime);
    });

    // 4. 扫描结束
    function finishScanning() {
      clearInterval(detectionInterval);
      cameraWrapper.classList.remove('scanning');
      
      if (emotionSamples.length === 0) {
        statusText.textContent = "未能检测到面部，请重试";
        startScanBtn.style.display = 'block';
        return;
      }

      // 计算众数
      const frequency = {};
      let maxFreq = 0;
      let dominantEmotion = 'neutral';

      emotionSamples.forEach(em => {
        frequency[em] = (frequency[em] || 0) + 1;
        if (frequency[em] > maxFreq) {
          maxFreq = frequency[em];
          dominantEmotion = em;
        }
      });

      localStorage.setItem('healing_startTime', Date.now()); // 识别结束时的时间
      localStorage.setItem('healing_initial_emotion', dominantEmotion); // 初始情绪
      localStorage.setItem('healing_emotion_samples', JSON.stringify(emotionSamples)); 
      localStorage.setItem('healing_history', JSON.stringify([])); // 空间访问历史
      
      showResultAndRedirect(dominantEmotion);
    }

    // 5. 显示结果并自动跳转
    function showResultAndRedirect(emotion) {
      const data = emotionMap[emotion] || emotionMap['neutral'];
      const targetUrl = SPACE_URLS[data.element];
      
      // 设置UI内容
      resultIcon.innerText = data.icon;
      resultTitle.innerText = "识别完成";
      resultDesc.innerHTML = `您当前的情绪状态为 <strong>${data.zh}</strong><br>正在进入您的专属疗愈空间...`;

      // 显示全屏遮罩
      resultOverlay.classList.add('show');
      statusText.textContent = "正在跳转...";

      // 3秒后跳转
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 3000);
    }

    // 辅助：五行中文名
    const elementDisplayNames = {
      'wood': '木', 'fire': '火', 'earth': '土', 'metal': '金', 'water': '水'
    };

    init();

  </script>
</body>
</html>
