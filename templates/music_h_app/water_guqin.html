{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water & Guqin Experience - Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/healing_tracker.js' %}"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* 视频层 */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        .bg-video.active {
            opacity: 1;
            z-index: 2;
        }

        /* 气泡层 */
        #bubble-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        /* 粒子画布层 */
        #ink-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 交互区域 */
        #interaction-zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80%;
            z-index: 20;
            display: flex;
        }

        .zone {
            flex: 1;
            height: 100%;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .zone-highlight {
            background: linear-gradient(to bottom, transparent, rgba(64, 164, 255, 0.15) 50%, transparent);
            box-shadow: inset 0 0 40px rgba(64, 164, 255, 0.1);
        }

        /* 精灵容器 */
        #sprite-container {
            position: absolute;
            width: var(--sprite-size);
            height: var(--sprite-size);
            top: 85%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: top 0.05s linear, left 0.05s linear;
        }

        .sprite-visual {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: breathe 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(64, 164, 255, 0.6));
        }

        .sprite-visual.active {
            animation: active-breathe 0.8s ease-in-out infinite alternate;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 5px rgba(64, 164, 255, 0.4));
            }

            50% {
                transform: translateY(calc(var(--float-amp) * -1)) scale(1.05);
                filter: drop-shadow(0 0 15px rgba(64, 164, 255, 0.7));
            }
        }

        @keyframes active-breathe {
            0% {
                transform: translateY(0) scale(1.1);
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
            }

            100% {
                transform: translateY(calc(var(--float-amp) * -1.2)) scale(1.25);
                filter: drop-shadow(0 0 40px rgba(64, 164, 255, 1));
            }
        }

        /* 目标图标 */
        #target-icon-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 25;
            display: none;
            pointer-events: none;
        }

        #icon-normal {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatIcon 2s infinite ease-in-out;
        }

        .target-guqin {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 10px rgba(64, 164, 255, 0.8));
        }

        .icon-hint {
            margin-top: 8px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #40A4FF;
        }

        #icon-miss {
            color: #FF6347;
            font-size: 2.5rem;
            font-weight: bold;
            animation: popMiss 0.3s ease-out forwards;
            display: none;
        }

        .feedback-text {
            position: absolute;
            font-size: 3rem;
            font-weight: 900;
            color: #40A4FF;
            text-shadow: 0 0 10px #fff;
            z-index: 100;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
        }

        .feedback-anim {
            animation: floatUpFade 0.8s ease-out forwards;
        }

        @keyframes floatUpFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, calc(-50% - 10px)) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, calc(-50% - 40px)) scale(1);
                opacity: 0;
            }
        }

        /* 提示页面 */
        #prompt-page {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9990;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s;
        }

        .prompt-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .prompt-line1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .highlight-water {
            color: #40A4FF;
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(64, 164, 255, 0.6);
        }

        .prompt-line2 {
            font-size: 1.2rem;
            color: #eee;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .prompt-line3 {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .guqin-icon-inline {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px #40A4FF);
        }

        /* UI Controls */
        #ui-layer {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            z-index: 30;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .glass-btn {
            pointer-events: auto;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 9999px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(64, 164, 255, 0.6);
        }

        /* 导航 */
        .nav-trigger {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            cursor: pointer;
            z-index: 35;
            text-decoration: none;
            opacity: 0.6;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .nav-trigger:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.05);
        }

        #nav-prev {
            left: 20px;
            flex-direction: row;
        }

        #nav-next {
            right: 20px;
            flex-direction: row-reverse;
        }

        .arrow-group {
            display: flex;
            align-items: center;
            gap: -5px;
        }

        .arrow-shape {
            width: 20px;
            height: 20px;
            border-top: 3px solid rgba(255, 255, 255, 0.9);
            border-right: 3px solid rgba(255, 255, 255, 0.9);
            transform: rotate(45deg) skew(10deg, 10deg);
            margin: 0 2px;
        }

        #nav-prev .arrow-shape {
            transform: rotate(-135deg) skew(10deg, 10deg);
        }

        .nav-text {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            margin: 0 15px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0 8px;
        }

        #nav-prev .nav-text {
            border-left: none;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 下拉菜单样式 */
        .music-layer-control {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 50;
            width: 220px;
        }

        .custom-select-trigger {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 20px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .custom-options {
            position: absolute;
            top: 100%;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 0 0 20px 20px;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            max-height: 350px;
            overflow-y: auto;
        }

        .custom-options.open {
            opacity: 1;
            visibility: visible;
        }

        .custom-option {
            padding: 10px 20px;
            color: #ccc;
            cursor: pointer;
        }

        .custom-option:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .volume-box {
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .volume-slider {
            width: 100%;
            cursor: pointer;
        }

        #btn-report {
            border: 1px solid rgba(64, 164, 255, 0.4);
            box-shadow: 0 0 10px rgba(64, 164, 255, 0.1);
        }

        #btn-report:hover {
            box-shadow: 0 0 20px rgba(64, 164, 255, 0.4);
            border-color: rgba(64, 164, 255, 0.8);
        }
    </style>
</head>

<body>
    <!-- 结束按钮 -->
    <div id="report-trigger-container" class="absolute top-8 left-8 z-[150] pointer-events-none">
        <button id="btn-report"
            class="glass-btn flex items-center gap-2 pointer-events-auto group border-blue-500/30 bg-blue-950/20 hover:bg-blue-600/30">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-blue-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="text-sm font-medium tracking-widest text-blue-100">结束疗愈 · 查看报告</span>
        </button>
    </div>

    <div id="transition-overlay"
        style="position: fixed; inset: 0; background: #000; z-index: 9999; pointer-events: none; transition: opacity 1.2s;">
    </div>

    <!-- 背景视频 -->
    <div id="video-container">
        <video id="video-1" class="bg-video active" muted playsinline autoplay></video>
        <video id="video-2" class="bg-video" muted playsinline autoplay></video>
    </div>

    <!-- 气泡层 -->
    <canvas id="bubble-canvas"></canvas>
    <!-- 粒子层 -->
    <canvas id="ink-canvas"></canvas>

    <!-- 交互层 -->
    <div id="interaction-zones">
        <div class="zone" data-index="0"></div>
        <div class="zone" data-index="1"></div>
        <div class="zone" data-index="2"></div>
        <div class="zone" data-index="3"></div>
    </div>

    <!-- 精灵 -->
    <div id="sprite-container">
        <img src="{% static 'sprite/water_happy.png' %}" class="sprite-visual" alt="精灵">
    </div>

    <!-- 引导页 -->
    <div id="prompt-page">
        <div class="prompt-content">
            <div class="prompt-line1"><span class="highlight-water">水</span>空间</div>

            <div class="prompt-line2">
                出现 <img class="guqin-icon-inline" src="{% static 'instrumentsIcon/guqin.png' %}"> 时，
                3s内根据提示点击或长按，感受指尖流水！
            </div>

            <div class="prompt-line3">准备好了吗？</div>

            <button id="start-interaction-btn" class="glass-btn" style="pointer-events: auto;">是的</button>
        </div>
    </div>

    <!-- 目标图标 -->
    <div id="target-icon-layer">
        <div id="icon-normal">
            <img src="{% static 'instrumentsIcon/guqin.png' %}" class="target-guqin">
            <div id="icon-hint" class="icon-hint">点击!</div>
        </div>
        <div id="icon-miss">MISS!</div>
    </div>

    <div id="feedback-text" class="feedback-text">Great!</div>

    <div id="ui-layer">
        <button id="btn-3d" class="glass-btn">进入 3D 沉浸模式</button>
    </div>

    <!-- 音乐控制 -->
    <div class="music-layer-control">
        <div class="custom-select-trigger" id="music-trigger">
            <span id="trigger-text">🎵 添加疗愈白噪音</span><span>▼</span>
        </div>
        <div class="custom-options" id="music-options">
            <div class="volume-box">
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.5">
            </div>
            <div class="custom-option" data-value="stop">⛔ 停止播放</div>
            <div class="custom-option" data-value="钵音">🥣 钵音</div>
            <div class="custom-option" data-value="晨钟暮鼓">🔔 晨钟暮鼓</div>
            <div class="custom-option" data-value="滴水">💧 滴水</div>
            <div class="custom-option" data-value="短笛">🎋 短笛</div>
            <div class="custom-option" data-value="放松">🍃 放松</div>
            <div class="custom-option" data-value="风铃">🎐 风铃</div>
            <div class="custom-option" data-value="疗愈">✨ 疗愈</div>
            <div class="custom-option" data-value="入眠">🌙 入眠</div>
            <div class="custom-option" data-value="唯美">🌸 唯美</div>
            <div class="custom-option" data-value="小雨">🌧️ 小雨</div>
            <div class="custom-option" data-value="雨声">⛈️ 雨声</div>
        </div>
    </div>

    <!-- 导航 -->
    <a id="nav-prev" class="nav-trigger" href="#">
        <div class="arrow-group">
            <div class="arrow-shape"></div>
            <div class="arrow-shape"></div>
        </div>
        <div class="nav-text">上一个空间</div>
    </a>

    <a id="nav-next" class="nav-trigger" href="#">
        <div class="nav-text">下一个空间</div>
        <div class="arrow-group">
            <div class="arrow-shape"></div>
            <div class="arrow-shape"></div>
        </div>
    </a>

    <audio id="ambient-audio" loop style="display:none;"></audio>
    <audio id="bg-music" loop style="display:none;"></audio>
    <audio id="hit-music" style="display:none;"></audio>
    <iframe id="viewer-frame"
        style="position:absolute; inset:0; width:100%; height:100%; border:none; z-index:40; opacity:0; pointer-events:none; transition:1s;"
        src=""></iframe>

    <script>
        // 1. 全局配置
        const SPRITE_MOVE_SPEED = 0.15;
        const SPRITE_SIZE = 240;
        const SPRITE_FLOAT_AMP = 50;

        const BUBBLE_SPAWN_RATE = 0.3; // 气泡产生频率
        const BUBBLE_RISE_SPEED = 0.2; // 气泡上升速度
        const BUBBLE_SIDE_DENSITY = 3; // 两侧气泡数量
        const BUBBLE_DECAY = 0.01; // 气泡衰退速度

        const NOTE_SPAWN_PROBABILITY = 0.5; // 音符频率
        const NOTE_SPAWN_AMOUNT = 1;        // 音符数量
        const NOTE_FLOAT_SPEED = 1.0;       // 音符速度
        const NOTE_MIN_SIZE = 35;           // 音符最小尺寸
        const NOTE_MAX_SIZE = 60;           // 音符最大尺寸

        const musicList = ["凤求凰", "广陵散", "胡笳十八拍", "仙翁操", "长相思"];
        const videoBasePath = "../../static/image_video/video/水/";
        const musicBasePath = "../../static/music_segment/古琴/";
        const videoList = [1, 2, 3, 4, 5, 6, 7];
        const maxPlayCount = 8;

        window.addEventListener('load', () => {
            if (window.HealingTracker) {
                HealingTracker.initSpace("水 (古琴)");
            }
        });

        // 2. 状态变量
        let activeVideoId = 1;
        let currentVideoName = "1";
        let currentVideoPlayCount = 0;
        let isMoving = false;
        let currentPos = { x: 50, y: 85 };
        let targetPos = { x: 50, y: 85 };
        let targetData = { show: false, x: 50, y: 50, zoneIndex: 0, status: 'normal', type: 'click' };
        let interruptCount = 0;
        let fadeInterval = null;

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty('--sprite-size', SPRITE_SIZE + 'px');
        rootStyle.setProperty('--float-amp', SPRITE_FLOAT_AMP + 'px');

        const video1 = document.getElementById('video-1');
        const video2 = document.getElementById('video-2');
        const bgMusic = document.getElementById('bg-music');
        const hitMusic = document.getElementById('hit-music');
        const spriteContainer = document.getElementById('sprite-container');

        // 3. 基础资源逻辑
        function initBackground() {
            currentVideoName = videoList[Math.floor(Math.random() * videoList.length)];
            video1.src = `${videoBasePath}${currentVideoName}.mp4`;
            video1.play().catch(() => { });
            playRandomBGM();
        }

        function playRandomBGM() {
            const idx = Math.floor(Math.random() * musicList.length);
            bgMusic.src = `${musicBasePath}${encodeURIComponent(musicList[idx])}.mp3`;
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => { });
        }

        function crossFadeVideo() {
            const nextVideo = activeVideoId === 1 ? video2 : video1;
            const currVideo = activeVideoId === 1 ? video1 : video2;
            currentVideoName = videoList[Math.floor(Math.random() * videoList.length)];
            nextVideo.src = `${videoBasePath}${currentVideoName}.mp4`;
            nextVideo.play().then(() => {
                nextVideo.classList.add('active');
                currVideo.classList.remove('active');
                activeVideoId = activeVideoId === 1 ? 2 : 1;
                currentVideoPlayCount = 0;
                setTimeout(() => { currVideo.pause(); }, 2000);
            });
        }

        [video1, video2].forEach(v => v.addEventListener('ended', () => {
            currentVideoPlayCount++;
            if (currentVideoPlayCount < maxPlayCount) v.play();
            else crossFadeVideo();
        }));

        // 4. 气泡系统
        const bCanvas = document.getElementById('bubble-canvas');
        const bCtx = bCanvas.getContext('2d');
        let bubbles = [];

        function resize() {
            bCanvas.width = window.innerWidth;
            bCanvas.height = window.innerHeight;
            document.getElementById('ink-canvas').width = window.innerWidth;
            document.getElementById('ink-canvas').height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function createBubble(side = 'bottom') {
            const r = Math.floor(Math.random() * 100 + 155);
            const g = Math.floor(Math.random() * 100 + 155);
            const b = 255;
            let x, y;
            if (side === 'bottom') {
                x = Math.random() * bCanvas.width;
                y = bCanvas.height + 20;
            } else if (side === 'left') {
                x = -20;
                y = Math.random() * bCanvas.height;
            } else {
                x = bCanvas.width + 20;
                y = Math.random() * bCanvas.height;
            }
            const centerPoint = bCanvas.width / 2;
            const centerBias = (centerPoint - x) * 0.005; // 气泡向中间靠拢

            bubbles.push({
                x, y,
                vx: (Math.random() - 0.5) * 2 + centerBias,
                vy: -(Math.random() * BUBBLE_RISE_SPEED + 1),
                size: Math.random() * 15 + 5,
                life: 1.0,
                color: `rgba(${r}, ${g}, ${b},`
            });
        }

        function updateBubbles() {
            bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
            if (isMoving && Math.random() < BUBBLE_SPAWN_RATE) {
                for (let i = 0; i < BUBBLE_SIDE_DENSITY; i++) {
                    createBubble('bottom');
                    createBubble('left');
                    createBubble('right');
                }
            }
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let p = bubbles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= BUBBLE_DECAY;
                if (p.life <= 0) { bubbles.splice(i, 1); continue; }
                bCtx.beginPath();
                bCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                bCtx.strokeStyle = p.color + (p.life * 0.6) + ')';
                bCtx.lineWidth = 2;
                bCtx.stroke();
            }
            requestAnimationFrame(updateBubbles);
        }
        updateBubbles();

        // 5. 音符粒子系统
        const inkCanvas = document.getElementById('ink-canvas');
        const iCtx = inkCanvas.getContext('2d');
        let noteParticles = [];

        // 监听精灵动作事件
        window.addEventListener('sprite-action', (e) => {
            const rect = spriteContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let amount = (e.detail && e.detail.type === 'burst') ? NOTE_SPAWN_AMOUNT * 6 : NOTE_SPAWN_AMOUNT;
            const notesChars = ['♪', '♫', '♬'];

            for (let i = 0; i < amount; i++) {
                // 随机产生颜色
                const r = Math.floor(Math.random() * 155 + 100);
                const g = Math.floor(Math.random() * 155 + 100);
                const b = 255; // 保持蓝色基调，但混合其他颜色

                noteParticles.push({
                    x: centerX + (Math.random() - 0.5) * 40,
                    y: centerY + (Math.random() - 0.5) * 40,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * NOTE_FLOAT_SPEED - 0.5,
                    life: 1.0,
                    size: Math.random() * (NOTE_MAX_SIZE - NOTE_MIN_SIZE) + NOTE_MIN_SIZE,
                    color: `rgb(${r}, ${g}, ${b})`,
                    text: notesChars[Math.floor(Math.random() * notesChars.length)]
                });
            }
        });

        // 绘制音符
        function drawNotes() {
            iCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
            for (let i = noteParticles.length - 1; i >= 0; i--) {
                let p = noteParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.015;

                if (p.life <= 0) {
                    noteParticles.splice(i, 1);
                    continue;
                }

                iCtx.globalAlpha = p.life;
                iCtx.font = `bold ${p.size}px Arial`;
                iCtx.fillStyle = p.color;
                iCtx.shadowBlur = 10;
                iCtx.shadowColor = p.color;
                iCtx.fillText(p.text, p.x, p.y);
                iCtx.shadowBlur = 0;
            }
            requestAnimationFrame(drawNotes);
        }
        drawNotes();

        // 6. 交互逻辑
        const zones = document.querySelectorAll('.zone');
        let iconTimer, missTimer;

        function generateNextIcon() {
            const zoneIndex = Math.floor(Math.random() * 4);
            const x = (zoneIndex * 25) + 5 + Math.random() * 15;
            const y = 20 + Math.random() * 40;
            const type = Math.random() > 0.5 ? 'click' : 'longpress';
            interruptCount = 0; // 每次生成新图标重置中断计数
            targetData = { show: true, x, y, zoneIndex, status: 'normal', type };

            const layer = document.getElementById('target-icon-layer');
            layer.style.display = 'block';
            layer.style.left = x + '%';
            layer.style.top = y + '%';
            document.getElementById('icon-normal').style.display = 'flex';
            document.getElementById('icon-miss').style.display = 'none';
            document.getElementById('icon-hint').innerText = type === 'click' ? '点击' : '长按';

            zones.forEach((z, i) => z.classList.toggle('zone-highlight', i === zoneIndex));
            iconTimer = setTimeout(handleMiss, 3000);
        }

        function handleMiss() {
            targetData.status = 'miss';
            if (window.HealingTracker) HealingTracker.logMiss(); 
            isMoving = false;
            document.getElementById('icon-normal').style.display = 'none';
            document.getElementById('icon-miss').style.display = 'block';
            zones.forEach(z => z.classList.remove('zone-highlight'));
            missTimer = setTimeout(() => {
                document.getElementById('target-icon-layer').style.display = 'none';
                generateNextIcon();
            }, 1000);
        }

        function onZoneDown(idx) {
            if (!targetData.show || targetData.status !== 'normal' || targetData.zoneIndex !== idx) return;
            clearTimeout(iconTimer);

            if (targetData.type === 'click') {
                currentPos = { x: targetData.x, y: targetData.y };
                showFeedback('Excellent!');
                if (window.HealingTracker) HealingTracker.logHit();
                window.dispatchEvent(new CustomEvent('sprite-action', { detail: { type: 'burst' } }));
                finishTarget();
            } else {
                targetPos = { x: targetData.x, y: targetData.y };
                isMoving = true;
                document.getElementById('icon-hint').innerText = '保持!';
                playHitSound();
            }
        }

        function finishTarget() {
            targetData.show = false;
            isMoving = false;
            document.getElementById('target-icon-layer').style.display = 'none';
            zones.forEach(z => z.classList.remove('zone-highlight'));
            fadeOutHitSound();
            setTimeout(generateNextIcon, 800);
        }

        function playHitSound() {
            if (fadeInterval) clearInterval(fadeInterval);
            hitMusic.src = `${musicBasePath}${encodeURIComponent(musicList[Math.floor(Math.random() * musicList.length)])}.mp3`;
            hitMusic.volume = 1;
            hitMusic.play().catch(() => { });
        }

        function fadeOutHitSound() {
            if (fadeInterval) clearInterval(fadeInterval);
            fadeInterval = setInterval(() => {
                if (hitMusic.volume > 0.05) hitMusic.volume -= 0.05;
                else {
                    clearInterval(fadeInterval);
                    hitMusic.pause();
                    hitMusic.volume = 1.0;
                }
            }, 50);
        }

        function showFeedback(txt) {
            const fb = document.getElementById('feedback-text');
            fb.innerText = txt;
            fb.style.left = targetData.x + '%';
            fb.style.top = targetData.y + '%';
            fb.style.display = 'block';
            fb.classList.remove('feedback-anim');
            void fb.offsetWidth;
            fb.classList.add('feedback-anim');
            setTimeout(() => { fb.style.display = 'none'; }, 800);
        }

        // 事件绑定
        zones.forEach((z, i) => {
            z.addEventListener('mousedown', () => onZoneDown(i));
            z.addEventListener('touchstart', (e) => { e.preventDefault(); onZoneDown(i); });
        });

        document.addEventListener('mouseup', () => {
            if (isMoving && targetData.type === 'longpress') {
                isMoving = false;
                interruptCount++; // 增加中断次数
                document.getElementById('icon-hint').innerText = '接住!';
                fadeOutHitSound();
                iconTimer = setTimeout(handleMiss, 3000); // 3秒不接回则Miss
            }
        });

        document.addEventListener('touchend', (e) => {
            if (isMoving && targetData.type === 'longpress') {
                isMoving = false;
                interruptCount++;
                document.getElementById('icon-hint').innerText = '接住!';
                fadeOutHitSound();
                iconTimer = setTimeout(handleMiss, 3000);
            }
        });

        // 交互逻辑的主循环
        function gameLoop() {
            if (isMoving) {
                const dx = targetPos.x - currentPos.x;
                const dy = targetPos.y - currentPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (Math.random() < NOTE_SPAWN_PROBABILITY) {
                    window.dispatchEvent(new CustomEvent('sprite-action', { detail: { type: 'continuous' } }));
                }

                if (dist < 1.5) { // 到达目标点
                    targetData.show = false;
                    isMoving = false;
                    document.getElementById('target-icon-layer').style.display = 'none';
                    zones.forEach(z => z.classList.remove('zone-highlight'));
                    window.dispatchEvent(new CustomEvent('sprite-action', { detail: { type: 'burst' } }));

                    // 根据点击次数反馈
                    let totalClicks = interruptCount + 1;
                    let fbText = '';
                    if (totalClicks === 1) fbText = 'Great!';
                    else if (totalClicks === 2) fbText = 'Good!';
                    else fbText = 'Not Bad!';
                    if (window.HealingTracker) HealingTracker.logHit();
                    showFeedback(fbText);
                    fadeOutHitSound();
                    setTimeout(generateNextIcon, 800);
                } else {
                    currentPos.x += (dx / dist) * SPRITE_MOVE_SPEED;
                    currentPos.y += (dy / dist) * SPRITE_MOVE_SPEED;
                }
                document.querySelector('.sprite-visual').classList.add('active');
            } else {
                document.querySelector('.sprite-visual').classList.remove('active');
            }
            spriteContainer.style.left = currentPos.x + '%';
            spriteContainer.style.top = currentPos.y + '%';
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        // 初始化按钮
        document.getElementById('start-interaction-btn').onclick = () => {
            document.getElementById('prompt-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('prompt-page').style.display = 'none';
                initBackground();
                generateNextIcon();
            }, 500);
        };

        // 7. 其他UI逻辑
        const btn3d = document.getElementById('btn-3d');
        const frame = document.getElementById('viewer-frame');
        btn3d.onclick = () => {
            frame.src = `{% url 'water_360' %}?id=${currentVideoName}`;
            frame.style.opacity = '1';
            frame.style.pointerEvents = 'auto';
        };
        window.addEventListener('message', e => {
            if (e.data === 'close360') { frame.style.opacity = '0'; frame.style.pointerEvents = 'none'; }
        });

        const trigger = document.getElementById('music-trigger');
        const options = document.getElementById('music-options');
        trigger.onclick = (e) => { e.stopPropagation(); options.classList.toggle('open'); };
        document.querySelectorAll('.custom-option').forEach(opt => {
            opt.onclick = function () {
                const val = this.dataset.value;
                if (val === 'stop') document.getElementById('ambient-audio').pause();
                else {
                    const audio = document.getElementById('ambient-audio');
                    audio.src = `../../static/music_segment/bk_music/${val}.mp3`;
                    audio.play();
                }
                document.getElementById('trigger-text').innerText = this.innerText;
                options.classList.remove('open');
            }
        });
        document.getElementById('volume-slider').oninput = (e) => { document.getElementById('ambient-audio').volume = e.target.value; };

        const spaces = ["{% url 'earth_pipa' %}", "{% url 'water_guqin' %}", "{% url 'metal_zhudi' %}", "{% url 'wood_xiao' %}", "{% url 'fire_erhu' %}"];
        const curIdx = 1;
        const overlay = document.getElementById('transition-overlay');
        setTimeout(() => overlay.style.opacity = '0', 100);

        function nav(url) {
            overlay.style.opacity = '1';
            setTimeout(() => {
                if (window.HealingTracker) {
                    HealingTracker.captureAndGo(url);// 保存数据并跳转
                } else {
                    window.location.href = url;
                }
            }, 1000);
        }

        document.getElementById('btn-report').onclick = (e) => {
            e.preventDefault();
            overlay.style.opacity = '1';
            setTimeout(() => {
                if (window.HealingTracker) {
                    HealingTracker.captureAndGo("{% url 'report_page' %}");
                } else {
                    window.location.href = "{% url 'report_page' %}";
                }
            }, 1000);
        };
        document.getElementById('nav-prev').onclick = (e) => { e.preventDefault(); nav(spaces[(curIdx + 4) % 5]); };
        document.getElementById('nav-next').onclick = (e) => { e.preventDefault(); nav(spaces[(curIdx + 1) % 5]); };

    </script>
</body>

</html>
