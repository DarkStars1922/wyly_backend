{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>用户注册</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent-primary: #2e49b6;
            --accent-secondary: #8a63d2;
            --link-color: #93c5fd;
            --link-hover: #dbeafe;
            --input-bg: #2a2a2a;
            --input-border: #3a3a3a;
            --input-text: #f0f0f0;
            --input-placeholder: #aaa;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(74, 108, 247, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(138, 99, 210, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-weight: 700;
            font-size: 2.8rem;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .card {
            background: var(--card-dark);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            z-index: -1;
            border-radius: 18px;
        }

        .card-header {
            background: rgba(30, 30, 30, 0.7);
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
        }

        .card-header h3 {
            font-weight: 600;
            font-size: 1.7rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 i {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control::placeholder {
            color: var(--input-placeholder);
            opacity: 1;
            font-style: italic;
            transition: opacity 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.25);
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
            transform: translateY(-2px);
        }

        .form-control:focus::placeholder {
            opacity: 0.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(74, 108, 247, 0.5);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(30deg);
            transition: all 0.6s;
        }

        .btn-primary:hover::after {
            transform: rotate(30deg) translate(100%, 100%);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 15px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--accent-primary);
        }

        .decoration {
            position: absolute;
            z-index: 1;
        }

        .decoration.circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(74, 108, 247, 0.1), transparent);
            top: 10%;
            left: 5%;
            animation: float 8s ease-in-out infinite;
        }

        .decoration.rectangle {
            width: 180px;
            height: 180px;
            border-radius: 25px;
            background: linear-gradient(45deg, transparent, rgba(138, 99, 210, 0.1));
            bottom: 10%;
            right: 5%;
            transform: rotate(45deg);
            animation: float 10s ease-in-out infinite;
        }

        .footer {
            padding: 20px 30px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .mt-5 {
            margin-top: 3rem;
        }

        .text-center {
            text-align: center;
        }

        .text-muted {
            color: var(--text-secondary);
        }

        .success-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .success-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .countdown {
            font-size: 1.2rem;
            margin-top: 20px;
            color: var(--accent-primary);
        }

        .terms-link {
            color: var(--link-color);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: all 0.3s;
        }

        .terms-link:hover {
            color: var(--link-hover);
        }

        .terms-link:focus-visible {
            outline: 3px solid rgba(219, 234, 254, 0.75);
            outline-offset: 3px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            padding: 12px 16px;
            border: 1px solid rgba(147, 197, 253, 0.6);
            border-radius: 10px;
            background: rgba(147, 197, 253, 0.1);
            color: var(--link-color);
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.5;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: all 0.3s;
        }

        .login-link:hover {
            color: var(--link-hover);
            border-color: var(--link-hover);
            background: rgba(147, 197, 253, 0.18);
            transform: translateY(-1px);
        }

        .login-link:focus-visible {
            outline: 3px solid rgba(219, 234, 254, 0.75);
            outline-offset: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 5px;
            background: var(--input-bg);
            overflow: hidden;
            position: relative;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        .password-strength-text {
            font-size: 0.85rem;
            margin-top: 5px;
            color: var(--text-secondary);
            text-align: right;
        }

        .password-tips {
            margin-top: 10px;
            padding: 10px;
            background: rgba(42, 42, 42, 0.5);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .password-match {
            margin-top: 5px;
            font-size: 0.85rem;
            text-align: right;
            height: 20px;
        }

        .match-valid {
            color: var(--success);
        }

        .match-invalid {
            color: var(--error);
        }

        .tip-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .tip-item i {
            margin-right: 8px;
            font-size: 0.8rem;
            width: 16px;
            text-align: center;
            color: var(--accent-secondary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            .card-body {
                padding: 25px;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .decoration.circle,
            .decoration.rectangle {
                display: none;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/site-mobile.css?v=20260507-mobile2">
</head>

<body>
    <div class="decoration circle"></div>
    <div class="decoration rectangle"></div>

    <!-- 成功跳转 -->
    <div class="success-screen" id="successScreen">
        <div class="success-content">
            <i class="fas fa-check-circle fa-5x mb-4" style="color: var(--success); animation: pulse 2s infinite;"></i>
            <h2 id="successMessage" class="mb-3">注册成功！</h2>
            <p class="lead">正在跳转到首页...</p>
            <div class="countdown" id="countdown">5</div>
            <button class="btn btn-primary mt-4" id="goHomeBtn" style="width: auto;">
                <i class="fas fa-home me-2"></i> 立即前往首页
            </button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>用户注册</h1>
            <p>创建您的专属账户</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-user-plus"></i> 新用户注册</h3>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="registerUsername" class="form-label">
                            <i class="fas fa-user"></i> 用户名
                        </label>
                        <input type="text" class="form-control" id="registerUsername" name="username" required
                            placeholder="创建您的用户名">
                    </div>

                    <div class="mb-3">
                        <label for="registerEmail" class="form-label">
                            <i class="fas fa-envelope"></i> 电子邮箱
                        </label>
                        <input type="email" class="form-control" id="registerEmail" name="email" required
                            placeholder="输入您的电子邮箱">
                    </div>

                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">
                            <i class="fas fa-lock"></i> 密码
                        </label>
                        <div class="password-container">
                            <input type="password" class="form-control" id="registerPassword" name="password" required
                                placeholder="请设置您的密码">
                            <span class="password-toggle" id="registerPasswordToggle">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="passwordStrengthBar"></div>
                        </div>
                        <div class="password-strength-text" id="passwordStrengthText">密码强度: 未输入</div>
                    </div>

                    <div class="mb-3">
                        <label for="registerConfirmPassword" class="form-label">
                            <i class="fas fa-lock"></i> 确认密码
                        </label>
                        <div class="password-container">
                            <input type="password" class="form-control" id="registerConfirmPassword"
                                name="confirmPassword" required placeholder="请再次输入密码">
                            <span class="password-toggle" id="registerConfirmPasswordToggle">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <div class="password-match" id="passwordMatch"></div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsAgreement" required>
                            <label class="form-check-label" for="termsAgreement">
                                我已阅读并同意 <a href="#" class="terms-link">服务条款</a> 和 <a href="#"
                                    class="terms-link">隐私政策</a>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">
                        <i class="fas fa-user-plus me-2"></i> 注册
                    </button>

                    <a href="{% url 'login_page' %}" class="login-link">
                        <i class="fas fa-sign-in-alt me-2"></i> 已有账户？立即登录
                    </a>
                </form>
            </div>
        </div>

        <div class="mt-5 text-center text-muted">
            <p>© 2026 星璇律动. 保留所有权利。</p>
            <p>AI驱动的歌词、音乐与视频一体化创作平台</p>
        </div>
    </div>

    <script>
        // 密码可见性切换功能
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function () {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // 密码强度检测
        const passwordInput = document.getElementById('registerPassword');
        const confirmPasswordInput = document.getElementById('registerConfirmPassword');

        passwordInput.addEventListener('input', updatePasswordStrength);
        confirmPasswordInput.addEventListener('input', checkPasswordMatch);

        function updatePasswordStrength() {
            const password = passwordInput.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');

            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthBar.style.background = 'transparent';
                strengthText.textContent = '密码强度: 未输入';
                strengthText.style.color = 'var(--text-secondary)';
                return;
            }

            // 更复杂的密码强度算法
            let strength = 0;
            let tips = "";

            // 长度加分
            strength += Math.min(password.length * 4, 40);

            // 包含小写字母
            if (/[a-z]/.test(password)) {
                strength += 10;
            }

            // 包含大写字母
            if (/[A-Z]/.test(password)) {
                strength += 15;
            }

            // 包含数字
            if (/\d/.test(password)) {
                strength += 15;
            }

            // 包含特殊字符
            if (/[^A-Za-z0-9]/.test(password)) {
                strength += 20;
            }

            // 根据总分确定强度级别
            let strengthLevel, color;

            if (strength < 40) {
                strengthLevel = '弱';
                color = 'var(--error)';
            } else if (strength < 70) {
                strengthLevel = '中等';
                color = 'var(--warning)';
            } else if (strength < 100) {
                strengthLevel = '强';
                color = '#66cc66';
            } else {
                strengthLevel = '非常强';
                color = 'var(--success)';
            }

            // 计算百分比
            const percentage = Math.min(strength, 100);

            // 更新UI
            strengthBar.style.width = percentage + '%';
            strengthBar.style.background = color;
            strengthText.textContent = `密码强度: ${strengthLevel}`;
            strengthText.style.color = color;

            // 同时检查密码匹配
            checkPasswordMatch();
        }

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const matchElement = document.getElementById('passwordMatch');

            if (password.length === 0 || confirmPassword.length === 0) {
                matchElement.textContent = '';
                return;
            }

            if (password === confirmPassword) {
                matchElement.textContent = '✓ 密码匹配';
                matchElement.className = 'password-match match-valid';
            } else {
                matchElement.textContent = '✗ 密码不匹配';
                matchElement.className = 'password-match match-invalid';
            }
        }

        // 注册表单提交处理
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (!username) {
                showError('registerUsername', '请输入用户名');
                return;
            }

            if (!email) {
                showError('registerEmail', '请输入邮箱');
                return;
            }

            if (!validateEmail(email)) {
                showError('registerEmail', '请输入有效的邮箱地址');
                return;
            }

            if (!password) {
                showError('registerPassword', '请输入密码');
                return;
            }

            if (password !== confirmPassword) {
                showError('registerConfirmPassword', '两次输入的密码不匹配');
                return;
            }

            if (!document.getElementById('termsAgreement').checked) {
                alert('请同意服务条款和隐私政策');
                return;
            }

            // 构造表单数据
            const formData = {
                username,
                email,
                password,
                confirm_password: confirmPassword
            };

            fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showSuccess('注册成功！');
                    } else {
                        alert(data.message || '注册失败');
                    }
                })
                .catch(error => {
                    console.error('注册请求失败:', error);
                    alert('网络错误，请稍后再试');
                });
        });

        // 显示错误提示
        function showError(inputId, message) {
            const input = document.getElementById(inputId);
            input.style.borderColor = 'var(--error)';
            input.placeholder = message;

            // 添加动画效果
            input.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-5px)' },
                { transform: 'translateX(5px)' },
                { transform: 'translateX(0)' }
            ], {
                duration: 300,
                iterations: 2
            });
        }

        // 显示成功消息并跳转
        function showSuccess(message) {
            const successScreen = document.getElementById('successScreen');
            const successMessage = document.getElementById('successMessage');
            const countdown = document.getElementById('countdown');
            const goHomeBtn = document.getElementById('goHomeBtn');

            successMessage.textContent = message;
            successScreen.classList.add('active');

            let seconds = 5;
            countdown.textContent = seconds;

            const countdownInterval = setInterval(() => {
                seconds--;
                countdown.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    redirectToHome();
                }
            }, 1000);

            goHomeBtn.addEventListener('click', redirectToHome);
        }

        // 跳转到首页
        function redirectToHome() {
            window.location.href = '/';
        }

        // 邮箱验证
        function validateEmail(email) {
            const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        //获取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

    </script>
    <script>
        document.cookie = "csrftoken={{ csrf_token }}";
    </script>

</body>

</html>
